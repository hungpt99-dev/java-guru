# Nginx alternative to deploy/Caddyfile.
#
# Use this only if the host already runs Nginx and you prefer to keep one web
# server. Mount the build output and include this file from your server block:
#
#   server {
#       listen 443 ssl http2;
#       server_name java-guru.dev;
#       # ... existing ssl_certificate lines ...
#
#       include /etc/nginx/snippets/java-guru.conf;
#   }
#
# It assumes `docker compose` publishes the container on 127.0.0.1:8080.

root /srv/java-guru;
index index.html;

# Compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml application/rss+xml;

# Immutable, content-hashed assets
location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /pagefind/ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# Clean URLs: /posts/foo -> /posts/foo/index.html
location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ $uri/index.html =404;
}

error_page 404 /404.html;

# If proxying to the container instead of serving files from disk, replace the
# `location /` block above with:
#
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
